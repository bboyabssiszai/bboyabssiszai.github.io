name: Deploy personal website
on:
  push:
    branches: [master]
    paths: ['personal-site/**', '.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: personal-website
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: personal-site/package-lock.json
      - run: npm ci
        working-directory: personal-site
      - run: npm run build
        working-directory: personal-site
      - run: touch personal-site/dist/.nojekyll
      - name: Publish GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: personal-site/dist
